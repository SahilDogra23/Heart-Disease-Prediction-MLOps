# All tunable settings live here. Code reads from this file, never hardcodes.
data:
  raw_path: "data/heart.csv"
  target_column: "target"
  test_size: 0.2
  random_state: 42

features:
  numeric: ["age", "trestbps", "chol", "thalach", "oldpeak"]
  categorical: ["sex", "cp", "fbs", "restecg", "exang", "slope", "ca", "thal"]

model:
  type: "logistic_regression"
  n_estimators: 100
  max_depth: 10
  random_state: 42dvcini

evaluation:
  primary_metric: "recall"
  min_accuracy: 0.65
  min_recall: 0.60